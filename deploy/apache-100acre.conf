# Apache site for 100 Acre Inc. Copy to /etc/apache2/sites-available/100acre.conf,
# change honey.example.com to your domain, then follow SELF-HOSTING.md.
#
# Needs Apache 2.4.47 or newer (for "upgrade=websocket"): check with `apache2 -v`.
# certbot turns this into an HTTPS site and copies these lines across.

<VirtualHost *:80>
    ServerName honey.example.com

    ProxyPreserveHost On
    # Everything goes to the game, and its live connections (WebSockets) too.
    ProxyPass        / http://127.0.0.1:3001/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/100acre-error.log
    CustomLog ${APACHE_LOG_DIR}/100acre-access.log combined
</VirtualHost>
