# Render blueprint: one free service that hosts both the multiplayer server
# and the web version of the game (for adding to an iPhone home screen).
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: 100-acre-inc
    runtime: node
    plan: free
    buildCommand: npm ci --prefix app && npm run build:web --prefix app && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
